# Audit COMP-007: keep dependencies and CI actions current. Updates arrive as PRs through the normal flow (CI + review);
# `develop` is the production branch, so nothing here deploys on its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major bumps (typescript, eslint, @types/node, ...) are upgrades with their own plan, not weekly noise: @types/node must also
    # follow the Node line in .nvmrc, not the newest release. Security advisories still open PRs regardless of this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
